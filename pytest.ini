[pytest]
# slow 标记的用例（几十分钟的编译与仿真）默认排除，避免混进常规回归。
# 单独跑：python -m pytest tests/ -q -m slow
markers =
    slow: 编译或运行耗时较长，默认不跑，用 -m slow 显式选中
    xdist_group: 同组用例固定在同一 worker 执行（llama2_7b 按策略分组共享编译缓存）
# 默认 32 路并行、按 xdist_group 分发：同文件/同策略的用例在同一 worker，
# 共享 module 级 7B 模型夹具，也避免多 worker 各持一份 7B 模型撑爆内存。
# 改并行度：-n 8；调试单文件关掉并行：-n 0
addopts = -m "not slow" -n 32 --dist loadgroup
