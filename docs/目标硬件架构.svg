<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <!-- ===================== background ===================== -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2b56"/>
      <stop offset="1" stop-color="#071d3d"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5c9e"/>
      <stop offset="1" stop-color="#1d3f73"/>
    </linearGradient>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ff8a3d"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4db8ff"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#37d67a"/>
    </marker>
    <marker id="arrGb" markerWidth="10" markerHeight="10" refX="3" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 Z" fill="#37d67a"/>
    </marker>
  </defs>
  <rect width="1360" height="1000" fill="url(#bg)"/>

  <text x="680" y="46" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">目标硬件架构：多隔离式「存算一体 DPU」+ Host 中转</text>
  <text x="680" y="74" fill="#9fc3ef" font-size="16" text-anchor="middle">片上 8GB · 无外部大显存 · DPU 之间无直连 · 无全局共享内存 · 所有跨片数据经 Host DRAM 中转</text>

  <!-- ===================== SYSTEM LEVEL ===================== -->
  <text x="60" y="118" fill="#ffd27f" font-size="18" font-weight="700">① 系统级拓扑（多 DPU 集群）</text>

  <!-- Host node -->
  <rect x="60" y="132" width="270" height="240" rx="12" fill="#12365f" stroke="#4db8ff" stroke-width="2"/>
  <text x="195" y="160" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">🖥️ Host 主机节点</text>

  <rect x="82" y="176" width="226" height="46" rx="7" fill="#e0592b"/>
  <text x="195" y="199" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Host CPU (x86 / ARM)</text>
  <text x="195" y="215" fill="#ffe3d3" font-size="11" text-anchor="middle">多设备消息调度 · 全局同步</text>

  <rect x="82" y="230" width="226" height="52" rx="7" fill="#2f7d3a"/>
  <text x="195" y="251" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">FlagCX Host Runtime</text>
  <text x="195" y="268" fill="#d6f5d6" font-size="11" text-anchor="middle">常驻通信进程 · send/recv · allreduce</text>

  <rect x="82" y="290" width="226" height="52" rx="7" fill="#1f5aa0"/>
  <text x="195" y="311" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Host DRAM</text>
  <text x="195" y="328" fill="#cfe6ff" font-size="11" text-anchor="middle">跨 DPU 中转缓冲区 (Staging Buffer)</text>

  <!-- PCIe bus bar -->
  <rect x="60" y="392" width="1240" height="34" rx="8" fill="#0e4a86" stroke="#4db8ff" stroke-width="1.5"/>
  <text x="680" y="414" fill="#dff0ff" font-size="14" font-weight="700" text-anchor="middle">PCIe / 互联总线 —— 仅 Host ↔ DPU（DPU 之间无直连）</text>

  <!-- Host to bus -->
  <line x1="195" y1="372" x2="195" y2="392" stroke="#37d67a" stroke-width="3" marker-end="url(#arrG)"/>

  <!-- DPU mini boxes -->
  <g>
    <rect x="440" y="252" width="200" height="120" rx="10" fill="url(#coreGrad)" stroke="#8fd0ff" stroke-width="2"/>
    <text x="540" y="278" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">DPU 0 (存算一体)</text>
    <rect x="462" y="290" width="156" height="30" rx="5" fill="#0d2f57"/>
    <text x="540" y="310" fill="#cfe6ff" font-size="12" text-anchor="middle">计算 + PIM 存算阵列</text>
    <rect x="462" y="326" width="156" height="30" rx="5" fill="#7a2f2f"/>
    <text x="540" y="346" fill="#ffd9d9" font-size="12" font-weight="700" text-anchor="middle">片上存储 8GB</text>
    <line x1="540" y1="426" x2="540" y2="372" stroke="#37d67a" stroke-width="3" marker-end="url(#arrGb)"/>
  </g>
  <g>
    <rect x="680" y="252" width="200" height="120" rx="10" fill="url(#coreGrad)" stroke="#8fd0ff" stroke-width="2"/>
    <text x="780" y="278" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">DPU 1 (存算一体)</text>
    <rect x="702" y="290" width="156" height="30" rx="5" fill="#0d2f57"/>
    <text x="780" y="310" fill="#cfe6ff" font-size="12" text-anchor="middle">计算 + PIM 存算阵列</text>
    <rect x="702" y="326" width="156" height="30" rx="5" fill="#7a2f2f"/>
    <text x="780" y="346" fill="#ffd9d9" font-size="12" font-weight="700" text-anchor="middle">片上存储 8GB</text>
    <line x1="780" y1="426" x2="780" y2="372" stroke="#37d67a" stroke-width="3" marker-end="url(#arrGb)"/>
  </g>
  <text x="960" y="318" fill="#9fc3ef" font-size="26" font-weight="700" text-anchor="middle">· · ·</text>
  <g>
    <rect x="1040" y="252" width="200" height="120" rx="10" fill="url(#coreGrad)" stroke="#8fd0ff" stroke-width="2"/>
    <text x="1140" y="278" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">DPU N (存算一体)</text>
    <rect x="1062" y="290" width="156" height="30" rx="5" fill="#0d2f57"/>
    <text x="1140" y="310" fill="#cfe6ff" font-size="12" text-anchor="middle">计算 + PIM 存算阵列</text>
    <rect x="1062" y="326" width="156" height="30" rx="5" fill="#7a2f2f"/>
    <text x="1140" y="346" fill="#ffd9d9" font-size="12" font-weight="700" text-anchor="middle">片上存储 8GB</text>
    <line x1="1140" y1="426" x2="1140" y2="372" stroke="#37d67a" stroke-width="3" marker-end="url(#arrGb)"/>
  </g>

  <!-- no-direct-link markers -->
  <line x1="640" y1="222" x2="680" y2="222" stroke="#ff5a5a" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="660" y="214" fill="#ff9a9a" font-size="14" text-anchor="middle">✕</text>
  <line x1="880" y1="222" x2="1040" y2="222" stroke="#ff5a5a" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="960" y="214" fill="#ff9a9a" font-size="13" text-anchor="middle">✕ 无片间直连 / 无全局共享显存</text>

  <!-- divider -->
  <line x1="60" y1="452" x2="1300" y2="452" stroke="#2f5c94" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- ===================== SINGLE DPU DETAIL ===================== -->
  <text x="60" y="486" fill="#ffd27f" font-size="18" font-weight="700">② 单颗「存算一体 DPU」内部结构（下层 FlagTree 编译优化范围）</text>

  <!-- DPU outer -->
  <rect x="60" y="500" width="1240" height="440" rx="14" fill="#0d2c52" stroke="#4db8ff" stroke-width="2.5"/>
  <rect x="76" y="514" width="60" height="30" rx="6" fill="#e0592b"/>
  <text x="106" y="534" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">DPU</text>

  <!-- Host stub (left) -->
  <rect x="90" y="600" width="90" height="240" rx="9" fill="#e0592b"/>
  <text x="135" y="726" fill="#fff" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-90 135 720)">Host</text>

  <!-- Scheduler -->
  <rect x="200" y="600" width="120" height="240" rx="9" fill="#1f6fc4"/>
  <text x="260" y="712" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">控制单元</text>
  <text x="260" y="734" fill="#dff0ff" font-size="13" text-anchor="middle">Scheduler</text>

  <!-- Config path Host->Scheduler -->
  <line x1="180" y1="720" x2="200" y2="720" stroke="#ff8a3d" stroke-width="3" marker-end="url(#arrO)"/>
  <line x1="200" y1="700" x2="180" y2="700" stroke="#ff8a3d" stroke-width="3" marker-end="url(#arrO)" transform="scale(-1,1) translate(-380,0)"/>

  <!-- Cores -->
  <g>
    <!-- Core 0 -->
    <rect x="360" y="574" width="220" height="196" rx="10" fill="url(#coreGrad)" stroke="#8fd0ff" stroke-width="1.5"/>
    <text x="470" y="598" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Core 0</text>
    <rect x="382" y="612" width="80" height="52" rx="6" fill="#dfe7f0"/>
    <text x="422" y="642" fill="#1d3f73" font-size="13" font-weight="700" text-anchor="middle">TEC</text>
    <rect x="478" y="612" width="80" height="52" rx="6" fill="#8fd18a"/>
    <text x="518" y="635" fill="#123d12" font-size="12" font-weight="700" text-anchor="middle">PIM</text>
    <text x="518" y="651" fill="#123d12" font-size="10" text-anchor="middle">存算阵列</text>
    <rect x="404" y="676" width="132" height="40" rx="6" fill="#f0f0f0"/>
    <text x="470" y="701" fill="#333" font-size="13" font-weight="700" text-anchor="middle">SM</text>
    <!-- Core 1 -->
    <rect x="600" y="574" width="220" height="196" rx="10" fill="url(#coreGrad)" stroke="#8fd0ff" stroke-width="1.5"/>
    <text x="710" y="598" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Core 1</text>
    <rect x="622" y="612" width="80" height="52" rx="6" fill="#dfe7f0"/>
    <text x="662" y="642" fill="#1d3f73" font-size="13" font-weight="700" text-anchor="middle">TEC</text>
    <rect x="718" y="612" width="80" height="52" rx="6" fill="#8fd18a"/>
    <text x="758" y="635" fill="#123d12" font-size="12" font-weight="700" text-anchor="middle">PIM</text>
    <text x="758" y="651" fill="#123d12" font-size="10" text-anchor="middle">存算阵列</text>
    <rect x="644" y="676" width="132" height="40" rx="6" fill="#f0f0f0"/>
    <text x="710" y="701" fill="#333" font-size="13" font-weight="700" text-anchor="middle">SM</text>
    <!-- dots -->
    <text x="880" y="686" fill="#cfe6ff" font-size="28" font-weight="700" text-anchor="middle">· · ·</text>
    <!-- Core N -->
    <rect x="940" y="574" width="220" height="196" rx="10" fill="url(#coreGrad)" stroke="#8fd0ff" stroke-width="1.5"/>
    <text x="1050" y="598" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Core N</text>
    <rect x="962" y="612" width="80" height="52" rx="6" fill="#dfe7f0"/>
    <text x="1002" y="642" fill="#1d3f73" font-size="13" font-weight="700" text-anchor="middle">TEC</text>
    <rect x="1058" y="612" width="80" height="52" rx="6" fill="#8fd18a"/>
    <text x="1098" y="635" fill="#123d12" font-size="12" font-weight="700" text-anchor="middle">PIM</text>
    <text x="1098" y="651" fill="#123d12" font-size="10" text-anchor="middle">存算阵列</text>
    <rect x="984" y="676" width="132" height="40" rx="6" fill="#f0f0f0"/>
    <text x="1050" y="701" fill="#333" font-size="13" font-weight="700" text-anchor="middle">SM</text>
  </g>

  <!-- Scheduler to cores config -->
  <line x1="320" y1="640" x2="360" y2="640" stroke="#ff8a3d" stroke-width="3" marker-end="url(#arrO)"/>

  <!-- Fabric network bar -->
  <rect x="360" y="786" width="800" height="34" rx="8" fill="#0e6fb0" stroke="#8fd0ff" stroke-width="1.5"/>
  <text x="760" y="808" fill="#eaf6ff" font-size="14" font-weight="700" text-anchor="middle">Fabric Network（片内互联）</text>
  <!-- cores to fabric -->
  <line x1="470" y1="770" x2="470" y2="786" stroke="#4db8ff" stroke-width="3" marker-end="url(#arrB)"/>
  <line x1="710" y1="770" x2="710" y2="786" stroke="#4db8ff" stroke-width="3" marker-end="url(#arrB)"/>
  <line x1="1050" y1="770" x2="1050" y2="786" stroke="#4db8ff" stroke-width="3" marker-end="url(#arrB)"/>

  <!-- On-chip 8GB storage (replaces L2 + DRAM) -->
  <rect x="360" y="836" width="800" height="72" rx="9" fill="#a4331f" stroke="#ff9a7a" stroke-width="2"/>
  <text x="760" y="866" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">片上存储 8GB（存算一体主存 · 无外部 HBM/DDR）</text>
  <text x="760" y="890" fill="#ffd9cf" font-size="12" text-anchor="middle">⚠ 单芯片容量硬上限 → 顶层 FlagScale 必须做「容量感知切分」</text>
  <line x1="760" y1="820" x2="760" y2="836" stroke="#4db8ff" stroke-width="3" marker-end="url(#arrB)"/>

  <!-- annotation: no external DRAM -->
  <rect x="1180" y="700" width="100" height="120" rx="10" fill="#3a1010" stroke="#ff5a5a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1230" y="748" fill="#ff9a9a" font-size="13" font-weight="700" text-anchor="middle">✕</text>
  <text x="1230" y="770" fill="#ff9a9a" font-size="12" text-anchor="middle">无外部</text>
  <text x="1230" y="788" fill="#ff9a9a" font-size="12" text-anchor="middle">DRAM</text>
  <text x="1230" y="806" fill="#ff9a9a" font-size="11" text-anchor="middle">(与周易X3</text>
  <text x="1230" y="820" fill="#ff9a9a" font-size="11" text-anchor="middle">关键差异)</text>

  <!-- ===================== LEGEND ===================== -->
  <g>
    <line x1="120" y1="965" x2="160" y2="965" stroke="#ff8a3d" stroke-width="4" marker-end="url(#arrO)"/>
    <text x="170" y="970" fill="#ffd9c0" font-size="14">Config Path 配置/调度</text>

    <line x1="360" y1="965" x2="400" y2="965" stroke="#4db8ff" stroke-width="4" marker-end="url(#arrB)"/>
    <text x="410" y="970" fill="#cfe6ff" font-size="14">Internal Data Path 片内数据</text>

    <line x1="660" y1="965" x2="700" y2="965" stroke="#37d67a" stroke-width="4" marker-end="url(#arrG)"/>
    <text x="710" y="970" fill="#c9f5d6" font-size="14">Host 中转跨片通路 (DPU→DRAM→DPU)</text>

    <line x1="1080" y1="965" x2="1120" y2="965" stroke="#ff5a5a" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="1130" y="970" fill="#ff9a9a" font-size="14">无直连 / 不存在</text>
  </g>
</svg>
